<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互動教學簡報動畫 - 語音旁白教學系統</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --highlight: #f59e0b;
      --success: #10b981;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-stack);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Navigation Bar */
    header {
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--accent);
    }

    /* Main Stage / Slide Container */
    #stage {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 32px 100px 32px;
      overflow: hidden;
    }

    .slide-wrapper {
      width: 100%;
      max-width: 1100px;
      height: 100%;
      max-height: 620px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.4s ease-out;
    }

    .slide-inner {
      flex: 1;
      padding: 40px 50px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Slide Content Typography & Elements */
    .slide-badge {
      display: inline-block;
      align-self: flex-start;
      padding: 4px 12px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .slide-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.25;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .slide-subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    .content-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 22px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .content-card.active-step {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-4px);
    }

    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .card-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* Code block styling */
    .code-box {
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 20px;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 0.92rem;
      line-height: 1.6;
      color: #e2e8f0;
      position: relative;
      margin-top: 12px;
      white-space: pre-wrap;
      user-select: text;
    }

    .code-box .kw { color: #f43f5e; font-weight: bold; }
    .code-box .fn { color: #38bdf8; }
    .code-box .str { color: #34d399; }
    .code-box .cmt { color: #64748b; font-style: italic; }

    /* Animated voice wave indicator */
    .voice-status-bar {
      position: absolute;
      top: 18px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.7);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .voice-waves {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 14px;
    }

    .wave-bar {
      width: 3px;
      height: 4px;
      background-color: var(--accent);
      border-radius: 2px;
      transition: height 0.15s ease;
    }

    .speaking .wave-bar:nth-child(1) { animation: wave 0.7s infinite alternate 0.1s; }
    .speaking .wave-bar:nth-child(2) { animation: wave 0.7s infinite alternate 0.3s; }
    .speaking .wave-bar:nth-child(3) { animation: wave 0.7s infinite alternate 0.2s; }
    .speaking .wave-bar:nth-child(4) { animation: wave 0.7s infinite alternate 0.4s; }

    @keyframes wave {
      0% { height: 4px; }
      100% { height: 16px; background-color: #60a5fa; }
    }

    /* Subtitles / Karaoke Voice Display */
    .caption-banner {
      padding: 14px 28px;
      background: rgba(10, 15, 28, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 1rem;
      color: #f1f5f9;
      line-height: 1.5;
    }

    .caption-icon {
      color: var(--accent);
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .caption-text {
      flex: 1;
      transition: opacity 0.2s ease;
    }

    /* Bottom Control Dock */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.92);
      border-top: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      padding: 10px 24px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-container {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .left-controls, .center-controls, .right-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
      border-color: var(--accent);
    }

    .btn-primary {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: white;
      border: none;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: scale(1.08);
      filter: brightness(1.15);
    }

    .slide-counter {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 65px;
      text-align: center;
    }

    select.voice-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      max-width: 170px;
      cursor: pointer;
    }

    select.voice-select option {
      background: #1e293b;
      color: white;
    }

    .speed-btn {
      font-size: 0.8rem;
      font-weight: 700;
      width: 42px;
      height: 32px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      cursor: pointer;
    }

    .speed-btn:hover {
      border-color: var(--accent);
    }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* Modal for Material Customizer */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-overlay.open {
      display: flex;
      animation: fadeIn 0.2s ease-out;
    }

    .modal-window {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 18px;
      width: 90%;
      max-width: 780px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body textarea {
      width: 100%;
      height: 340px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #e2e8f0;
      font-family: Consolas, monospace;
      font-size: 0.9rem;
      padding: 14px;
      resize: vertical;
      line-height: 1.5;
    }

    .modal-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      background: rgba(15, 23, 42, 0.5);
    }

    /* Welcome / Start Overlay (To satisfy browser Audio autoplay policy) */
    .start-screen {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .start-card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 44px 50px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px var(--accent-glow);
      max-width: 520px;
    }

    .start-btn {
      margin-top: 28px;
      padding: 14px 36px;
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: white;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
      transition: all 0.25s ease;
    }

    .start-btn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 10px 28px rgba(56, 189, 248, 0.6);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>
      <span>語音動畫教學簡報系統</span>
    </div>

    <div class="top-actions">
      <button class="btn-secondary" id="btnEditContent" title="編輯或貼上自訂教材內容">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        編輯/匯入教材
      </button>

      <button class="btn-secondary" id="btnFullscreen" title="全螢幕展示 (F)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
        全螢幕
      </button>
    </div>
  </header>

  <!-- Presentation Stage -->
  <main id="stage">
    <!-- Click to Start Screen (Required for Web Audio/Speech Synthesis Unlock) -->
    <div class="start-screen" id="startScreen">
      <div class="start-card">
        <div style="font-size: 3rem; margin-bottom: 12px;">🎙️</div>
        <h2 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 10px;">教材語音教學已就緒</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6;">
          本網頁運用瀏覽器原生語音引擎（SpeechSynthesis）進行語音講述與動畫同步導航。
          點擊下方按鈕以解除瀏覽器自動發聲限制並開始學習。
        </p>
        <button class="start-btn" id="btnStartLecture">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          開始播放教學
        </button>
      </div>
    </div>

    <!-- Active Slide Card -->
    <div class="slide-wrapper" id="slideWrapper">
      <!-- Voice Status Indicator -->
      <div class="voice-status-bar" id="voiceIndicator">
        <div class="voice-waves">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
        <span id="voiceStatusText">語音就緒</span>
      </div>

      <!-- Slide Main Content (Injected by JS) -->
      <div class="slide-inner" id="slideContent">
        <!-- Dynamic Content -->
      </div>

      <!-- Subtitle / Karaoke Voice Line -->
      <div class="caption-banner">
        <div class="caption-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </div>
        <div class="caption-text" id="captionText">點擊播放鈕開始語音解說...</div>
      </div>
    </div>
  </main>

  <!-- Bottom Player Dock -->
  <footer>
    <!-- Timeline progress bar -->
    <div class="progress-container" id="progressBar" title="點擊切換進度">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="controls-row">
      <!-- Left Controls: Slide Navigation -->
      <div class="left-controls">
        <button class="btn-icon" id="btnPrev" title="上一頁 (←)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <button class="btn-icon btn-primary" id="btnPlayPause" title="播放 / 暫停 (空白鍵)">
          <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <svg id="pauseIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>

        <button class="btn-icon" id="btnNext" title="下一頁 (→)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <button class="btn-icon" id="btnReplay" title="重新解說本頁">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 2v6h6"></path>
            <path d="M21 12A9 9 0 0 0 6 5.3L3 8"></path>
            <path d="M21 22v-6h-6"></path>
            <path d="M3 12a9 9 0 0 0 15 6.7l3-2.7"></path>
          </svg>
        </button>

        <div class="slide-counter" id="slideCounter">1 / 5</div>
      </div>

      <!-- Center Controls: Voice selection & Rate -->
      <div class="center-controls">
        <label class="toggle-wrap">
          <span>聲音選擇:</span>
          <select id="voiceSelect" class="voice-select" title="選擇瀏覽器語音"></select>
        </label>

        <button class="speed-btn" id="btnSpeed" title="語速調整">1.0x</button>
      </div>

      <!-- Right Controls: Auto-Advance & Volume -->
      <div class="right-controls">
        <label class="toggle-wrap">
          <input type="checkbox" id="chkAutoAdvance" checked style="accent-color: var(--accent); cursor: pointer;">
          <span>自動翻頁</span>
        </label>

        <button class="btn-icon" id="btnMute" title="靜音 / 開啟聲音 (M)">
          <svg id="volOnIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="volOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <!-- Modal: Content Editor / Importer -->
  <div class="modal-overlay" id="editorModal">
    <div class="modal-window">
      <div class="modal-header">
        <h3>自訂教材內容與語音旁白 (JSON 格式)</h3>
        <button class="btn-icon" id="btnCloseModal" style="width: 32px; height: 32px;">✕</button>
      </div>
      <div class="modal-body">
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 10px;">
          您可以直接在此修改每一頁的標題、內容項目與語音旁白稿（speech），儲存後即可直接播放您指定的教材內容：
        </p>
        <textarea id="jsonEditor" spellcheck="false"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="btnResetDefault">恢復預設教材</button>
        <button class="btn-secondary" style="background: var(--accent); color: #0f172a; font-weight: 700;" id="btnApplyContent">儲存並即時更新</button>
      </div>
    </div>
  </div>

  <script>
    /**
     * 教材資料結構 (Presentation Slides Data)
     * 包含每一頁的章節標籤、標題、副標題、版面內容卡片、程式碼範例以及專屬的「瀏覽器語音旁白稿 (speech)」
     */
    const DEFAULT_COURSE_DATA = [
      {

        cards: [
          {
            icon: "🚀",

          {

          },
          {
            icon: "✨",
            title: "隨插即用的彈性",
            desc: "支援即時自訂教材編輯器，隨時替換您需要的課程章節、技術筆記或教育訓練內容。"

        ],
        speech: "歡迎參加本次的教學課程。今天我們將介紹如何運用現代網頁科技結合瀏覽器預設語音，打造生動流暢的自動化互動教材。請跟隨畫面的提示與導引，我們即將展開學習旅程。"

      {

        cards: [
          {

          },

          },
          {

            title: "跨平台語音庫支援",

        ],
        speech: "接下來我們探討瀏覽器內建的語音原理。現代瀏覽器都支援原生 Web Speech API。透過 SpeechSynthesis 控制器，系統能直接調用作業系統中的預設語音庫，免除伺服器傳輸延遲，實現極速流暢的旁白講述。"

      {

        code: `// 1. 建立語音朗讀實例\nconst utterance = new SpeechSynthesisUtterance("各位學員好，這是語音示範！");\n\n// 2. 設定語音參數與語系\nutterance.lang = "zh-TW";\nutterance.rate = 1.0; // 語速\nutterance.pitch = 1.0; // 音調\n\n// 3. 呼叫瀏覽器語音發聲\nwindow.speechSynthesis.speak(utterance);`,

        ],

          },
          {

          },
          {

          }
        ],
        speech: "好的教材不僅要有聲音，視覺動畫更是不可或缺。透過 CSS 轉場與聲波動畫，能夠隨時引導學員的專注力。底部的即時字幕更讓聽覺與視覺雙軌並進，大幅提升教學成效。"
      },
      {
        badge: "單元五 · 課程結語",
        title: "學習總結與自訂實踐",
        subtitle: "恭喜您完成本課程！您可以點擊右上方的「編輯/匯入教材」按鈕，立即套用您自己的課程講義。",
        cards: [
          {
            icon: "🎉",
            title: "掌握核心技能",
            desc: "您已瞭解 Web Speech API、狀態控制、音畫同步及教材結構化組織方法。"
          },
          {
            icon: "🛠️",
            title: "打造專屬教材",
            desc: "隨時開啟教材編輯器，貼上您的專業知識、技術文件或教學簡報，一鍵生成語音動畫網頁！"
          },
          {
            icon: "🌐",
            title: "便利分享散播",
            desc: "單一 HTML 檔案架構，可直接用瀏覽器開啟或部署至任何靜態網站，便於隨時分享交流。"
          }
        ],
        speech: "恭喜您順利完成所有課程單元！這套系統採用單一 HTML 檔案設計，方便您直接分享或修改。現在您可以點擊右上角的編輯教材按鈕，貼上自己的教學大綱，親自體驗專屬的語音教學網頁！"
      }
    ];

    // App State Management
    let courseData = JSON.parse(localStorage.getItem("custom_course_data")) || DEFAULT_COURSE_DATA;
    let currentSlide = 0;
    let isPlaying = false;
    let isMuted = false;
    let autoAdvance = true;
    let playbackRate = 1.0;
    let selectedVoice = null;
    let currentUtterance = null;

    // DOM Elements
    const stage = document.getElementById("stage");
    const slideContent = document.getElementById("slideContent");
    const captionText = document.getElementById("captionText");
    const slideCounter = document.getElementById("slideCounter");
    const progressFill = document.getElementById("progressFill");
    const voiceIndicator = document.getElementById("voiceIndicator");
    const voiceStatusText = document.getElementById("voiceStatusText");
    const voiceSelect = document.getElementById("voiceSelect");

    const btnStartLecture = document.getElementById("btnStartLecture");
    const startScreen = document.getElementById("startScreen");
    const btnPlayPause = document.getElementById("btnPlayPause");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const btnReplay = document.getElementById("btnReplay");
    const btnSpeed = document.getElementById("btnSpeed");
    const btnMute = document.getElementById("btnMute");
    const volOnIcon = document.getElementById("volOnIcon");
    const volOffIcon = document.getElementById("volOffIcon");
    const chkAutoAdvance = document.getElementById("chkAutoAdvance");
    const progressBar = document.getElementById("progressBar");

    // Modal elements
    const btnEditContent = document.getElementById("btnEditContent");
    const editorModal = document.getElementById("editorModal");
    const btnCloseModal = document.getElementById("btnCloseModal");
    const jsonEditor = document.getElementById("jsonEditor");
    const btnApplyContent = document.getElementById("btnApplyContent");
    const btnResetDefault = document.getElementById("btnResetDefault");
    const btnFullscreen = document.getElementById("btnFullscreen");

    // Initialize Voice List from Browser
    function populateVoices() {
      if (!('speechSynthesis' in window)) {
        captionText.textContent = "警告：您的瀏覽器不支援 Web Speech 語音合成 API。";
        return;
      }

      const voices = window.speechSynthesis.getVoices();
      voiceSelect.innerHTML = "";

      if (voices.length === 0) return;

      // Prioritize Chinese voices (zh-TW, zh-HK, zh-CN, zh)
      const zhVoices = voices.filter(v => v.lang.startsWith("zh") || v.lang.includes("CHT") || v.lang.includes("Chinese"));
      const otherVoices = voices.filter(v => !zhVoices.includes(v));
      const sortedVoices = [...zhVoices, ...otherVoices];

      sortedVoices.forEach((voice, index) => {
        const option = document.createElement("option");
        option.value = voice.name;
        option.textContent = `${voice.name} (${voice.lang})`;
        if (voice.default || index === 0) {
          option.selected = true;
          selectedVoice = voice;
        }
        voiceSelect.appendChild(option);
      });

      // Prefer a natural Chinese voice if available
      const preferred = zhVoices.find(v => v.lang.includes("TW") || v.name.includes("Taiwan") || v.name.includes("Yating") || v.name.includes("HanHan") || v.name.includes("HsiaoChen"));
      if (preferred) {
        voiceSelect.value = preferred.name;
        selectedVoice = preferred;
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = populateVoices;
      populateVoices();
    }

    voiceSelect.addEventListener("change", (e) => {
      const voices = window.speechSynthesis.getVoices();
      selectedVoice = voices.find(v => v.name === e.target.value) || null;
      if (isPlaying) {
        speakCurrentSlide();
      }
    });

    // Render Slide Content
    function renderSlide(index) {
      const data = courseData[index];
      if (!data) return;

      let html = `
        <span class="slide-badge">${data.badge || `單元 ${index + 1}`}</span>
        <h1 class="slide-title">${data.title}</h1>
        <p class="slide-subtitle">${data.subtitle || ""}</p>
      `;

      if (data.code) {
        // Simple HTML Escaping & formatting for code
        const safeCode = data.code
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
        html += `<div class="code-box"><code>${safeCode}</code></div>`;
      }

      if (data.cards && data.cards.length > 0) {
        html += `<div class="content-grid">`;
        data.cards.forEach((card, i) => {
          html += `
            <div class="content-card" id="card-${i}">
              <div class="card-icon">${card.icon || "📌"}</div>
              <div class="card-title">${card.title}</div>
              <div class="card-desc">${card.desc}</div>
            </div>
          `;
        });
        html += `</div>`;
      }

      slideContent.innerHTML = html;
      slideCounter.textContent = `${index + 1} / ${courseData.length}`;
      progressFill.style.width = `${((index + 1) / courseData.length) * 100}%`;
    }

    // Speech Controller
    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      voiceIndicator.classList.remove("speaking");
      voiceStatusText.textContent = "已暫停";
    }

    function speakCurrentSlide() {
      stopSpeech();
      if (!isPlaying || isMuted) {
        voiceStatusText.textContent = isMuted ? "已靜音" : "已暫停";
        return;
      }

      const data = courseData[currentSlide];
      if (!data || !data.speech) {
        captionText.textContent = "（本頁無語音講稿）";
        if (autoAdvance && isPlaying) {
          setTimeout(() => nextSlide(), 2000);
        }
        return;
      }

      captionText.textContent = data.speech;
      voiceStatusText.textContent = "語音講述中...";
      voiceIndicator.classList.add("speaking");

      currentUtterance = new SpeechSynthesisUtterance(data.speech);
      currentUtterance.rate = playbackRate;
      currentUtterance.pitch = 1.0;

      if (selectedVoice) {
        currentUtterance.voice = selectedVoice;
      } else {
        currentUtterance.lang = "zh-TW";
      }

      // Card highlight effect during speech
      const cards = document.querySelectorAll(".content-card");
      cards.forEach(c => c.classList.remove("active-step"));
      if (cards.length > 0) {
        cards[0].classList.add("active-step");
      }

      currentUtterance.onend = () => {
        voiceIndicator.classList.remove("speaking");
        voiceStatusText.textContent = "本頁講述完畢";

        if (isPlaying && autoAdvance) {
          if (currentSlide < courseData.length - 1) {
            setTimeout(() => {
              if (isPlaying) nextSlide();
            }, 1200);
          } else {
            isPlaying = false;
            updatePlayPauseButton();
            voiceStatusText.textContent = "課程結束";
          }
        }
      };

      currentUtterance.onerror = (e) => {
        console.warn("SpeechSynthesis error:", e);
        voiceIndicator.classList.remove("speaking");
        voiceStatusText.textContent = "語音中止";
      };

      window.speechSynthesis.speak(currentUtterance);
    }

    // Slide Navigation
    function goToSlide(index) {
      if (index < 0) index = 0;
      if (index >= courseData.length) index = courseData.length - 1;
      currentSlide = index;
      renderSlide(currentSlide);
      if (isPlaying) {
        speakCurrentSlide();
      } else {
        captionText.textContent = courseData[currentSlide].speech || "點擊播放鈕開始語音解說...";
      }
    }

    function nextSlide() {
      if (currentSlide < courseData.length - 1) {
        goToSlide(currentSlide + 1);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        goToSlide(currentSlide - 1);
      }
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;
      updatePlayPauseButton();
      if (isPlaying) {
        speakCurrentSlide();
      } else {
        stopSpeech();
      }
    }

    function updatePlayPauseButton() {
      if (isPlaying) {
        playIcon.style.display = "none";
        pauseIcon.style.display = "block";
      } else {
        playIcon.style.display = "block";
        pauseIcon.style.display = "none";
      }
    }

    // Speed Control (0.8x -> 1.0x -> 1.25x -> 1.5x)
    const speeds = [0.8, 1.0, 1.25, 1.5];
    btnSpeed.addEventListener("click", () => {
      let currentIndex = speeds.indexOf(playbackRate);
      let nextIndex = (currentIndex + 1) % speeds.length;
      playbackRate = speeds[nextIndex];
      btnSpeed.textContent = `${playbackRate}x`;
      if (isPlaying) {
        speakCurrentSlide();
      }
    });

    // Mute Control
    btnMute.addEventListener("click", () => {
      isMuted = !isMuted;
      if (isMuted) {
        volOnIcon.style.display = "none";
        volOffIcon.style.display = "block";
        stopSpeech();
      } else {
        volOnIcon.style.display = "block";
        volOffIcon.style.display = "none";
        if (isPlaying) speakCurrentSlide();
      }
    });

    // Auto-advance Checkbox
    chkAutoAdvance.addEventListener("change", (e) => {
      autoAdvance = e.target.checked;
    });

    // Progress Bar Click Jump
    progressBar.addEventListener("click", (e) => {
      const rect = progressBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      const targetIndex = Math.min(courseData.length - 1, Math.max(0, Math.floor(pct * courseData.length)));
      goToSlide(targetIndex);
    });

    // Start Button Event
    btnStartLecture.addEventListener("click", () => {
      startScreen.style.display = "none";
      isPlaying = true;
      updatePlayPauseButton();
      goToSlide(0);
    });

    // Button Listeners
    btnPlayPause.addEventListener("click", togglePlayPause);
    btnNext.addEventListener("click", nextSlide);
    btnPrev.addEventListener("click", prevSlide);
    btnReplay.addEventListener("click", () => {
      if (!isPlaying) isPlaying = true;
      updatePlayPauseButton();
      speakCurrentSlide();
    });

    // Keyboard Shortcuts
    window.addEventListener("keydown", (e) => {
      // Don't trigger shortcuts when typing in editor textarea
      if (editorModal.classList.contains("open")) return;

      if (e.code === "Space") {
        e.preventDefault();
        togglePlayPause();
      } else if (e.code === "ArrowRight") {
        nextSlide();
      } else if (e.code === "ArrowLeft") {
        prevSlide();
      } else if (e.key.toLowerCase() === "m") {
        btnMute.click();
      } else if (e.key.toLowerCase() === "f") {
        toggleFullscreen();
      }
    });

    // Fullscreen Toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
    btnFullscreen.addEventListener("click", toggleFullscreen);

    // Modal Editor Handling
    btnEditContent.addEventListener("click", () => {
      jsonEditor.value = JSON.stringify(courseData, null, 2);
      editorModal.classList.add("open");
    });

    btnCloseModal.addEventListener("click", () => {
      editorModal.classList.remove("open");
    });

    editorModal.addEventListener("click", (e) => {
      if (e.target === editorModal) editorModal.classList.remove("open");
    });

    btnApplyContent.addEventListener("click", () => {
      try {
        const parsed = JSON.parse(jsonEditor.value);
        if (!Array.isArray(parsed) || parsed.length === 0) {
          alert("請提供至少包含一頁的 JSON 陣列！");
          return;
        }
        courseData = parsed;
        localStorage.setItem("custom_course_data", JSON.stringify(courseData));
        editorModal.classList.remove("open");
        currentSlide = 0;
        goToSlide(0);
        alert("教材內容已成功更新！");
      } catch (err) {
        alert("JSON 格式有誤，請檢查語法：\n" + err.message);
      }
    });

    btnResetDefault.addEventListener("click", () => {
      if (confirm("確定要重設為預設教學教材嗎？")) {
        courseData = DEFAULT_COURSE_DATA;
        localStorage.removeItem("custom_course_data");
        jsonEditor.value = JSON.stringify(courseData, null, 2);
        goToSlide(0);
        editorModal.classList.remove("open");
      }
    });

    // Initial Load
    renderSlide(0);
  </script>
</body>
